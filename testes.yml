name: Testes da demonstração pública
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check demo/scoring.js
          node --check demo/app.js
      - name: Executar testes sem dependências externas
        run: node --test tests/ranking.test.js
